[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agilent-cytation-server"
version = "0.1.0"
description = "PyLabRobot-backed driver and STATUS_SPEC REST API for the BioTek (Agilent) Cytation 5 plate reader (lab status spec v1.2)"
readme = "README.md"
authors = [
    { name = "Yang Cao", email = "cyrilcaoyang@gmail.com" },
]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["pylabrobot", "cytation", "biotek", "agilent", "plate-reader", "lab-automation"]

# Core dependencies are intentionally minimal so dev / CI installs on
# macOS / Linux do not pull in the (Windows-only) USB stack. The real
# Cytation backend is installed via the ``plr`` extra (and ``windows``
# extra for the libusb shims). Tests on the dev box exercise the
# in-memory stub driver only and never import pylabrobot.
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "sdl-lab-contract",
]

[tool.uv.sources]
sdl-lab-contract = { git = "https://github.com/AccelerationConsortium/sdl-lab-contract", tag = "v1.2.0" }

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]
plr = [
    # PyLabRobot's PlateReader frontend + Cytation 5 backend. Lazy-imported
    # by `agilent_cytation_server.reader` so it is only required when
    # `dry_run = false` and a real Cytation is being driven.
    "pylabrobot>=0.2.1",
]
windows = [
    # PyLabRobot's USB transport. Requires Zadig to bind the Cytation USB
    # endpoint to libusbK on the lab PC (see README).
    "pyusb>=1.2; sys_platform == 'win32'",
    "libusb-package>=1.0; sys_platform == 'win32'",
    # pylabrobot.io.ftdi (Cytation 5 backend) imports pylibftdi.
    "pylibftdi>=0.20; sys_platform == 'win32'",
]
d2xx = [
    # Alternative FTDI transport: drives the reader through FTDI's own vendor
    # driver instead of libusb, so the chip no longer has to be Zadig-bound to
    # libusbK and Gen5 can share it. Enable with
    # `[instrument].ftdi_transport = "d2xx"`; see docs/GEN5_ABSORBANCE.md.
    #
    # The DLL itself (ftd2xx.dll) ships with FTDI's CDM driver and is already
    # present wherever Gen5 runs - only the Python wrapper is needed here.
    "ftd2xx>=1.3; sys_platform == 'win32'",
]
imaging = [
    # The microscopy path. numpy is what pylabrobot's `_acquire_image`
    # hands back; pillow is what turns that array into a PNG on disk.
    #
    # numpy is pinned <2 because PySpin is built against the 1.x C ABI —
    # under 2.x, `import PySpin` dies with "numpy.core.multiarray failed
    # to import". This pin is load-bearing, not tidiness.
    "numpy<2",
    "pillow>=10",
    # Autofocus / focus scoring (pylabrobot's evaluate_focus imports cv2).
    # Headless build: the service has no GUI and the full opencv-python
    # wheel drags in Qt.
    "opencv-python-headless>=4.8",
    # NOTE: spinnaker_python (PySpin) is deliberately NOT declared here.
    # FLIR does not publish it to PyPI — it ships as a per-CPython-minor
    # wheel from Teledyne's portal, so no resolver can fetch it, and
    # declaring it would break `uv sync` on every box lacking the file.
    # Install it out-of-band:
    #
    #   uv pip install "<path>\spinnaker_python-<ver>-cp310-cp310-win_amd64.whl"
    #
    # Because it sits outside the lockfile, plain `uv run` PRUNES it at
    # every start. The deployed service therefore runs `uv run --no-sync`
    # so the env is never rebuilt behind the service's back. RUNBOOK §3.1.
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
agilent-cytation-serve = "agilent_cytation_server.__main__:main"

[project.urls]
Repository = "https://github.com/cyrilcaoyang/agilent-cytation-server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"
